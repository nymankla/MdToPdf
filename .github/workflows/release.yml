name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  # Fails before anything is built if the tag and Directory.Build.props disagree.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the tag with Directory.Build.props
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match version $version in Directory.Build.props"
            exit 1
          }

  build:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mdtopdf-win-x64
          path: package

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp README.md package/
          (cd package && zip -q "../dist/mdtopdf-$version-win-x64.zip" mdtopdf.exe README.md)
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "MdToPdf ${GITHUB_REF_NAME#v}"
